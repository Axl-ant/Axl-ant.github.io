<section class="skills-section">
  <div class="section-heading">
    <span class="section-label">MIS CONOCIMIENTOS</span>
    <h2>Habilidades</h2>
    <p>Tecnologías y conocimientos que forman parte de mi aprendizaje.</p>
  </div>

  <div class="skills-grid" *ngIf="skillsList.length > 0">
    <article class="skill-card" *ngFor="let skill of skillsList">
      <div class="skill-card-top">
        <h3>{{ skill.name }}</h3>
        <span class="skill-category" *ngIf="skill.category">
          {{ skill.category }}
        </span>
      </div>

      <p class="skill-level" *ngIf="skill.level">
        Nivel: {{ skill.level }}
      </p>

      <p class="skill-description" *ngIf="skill.description">
        {{ skill.description }}
      </p>
    </article>
  </div>

  <p class="empty-message" *ngIf="skillsList.length === 0">
    Mis habilidades aparecerán aquí próximamente.
  </p>
</section>
