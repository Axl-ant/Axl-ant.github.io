<section class="interests-section">
  <div class="section-heading">
    <span class="section-label">CRECIMIENTO PROFESIONAL</span>
    <h2>Intereses</h2>
    <p>Áreas de tecnología que me interesan y en las que deseo seguir aprendiendo.</p>
  </div>

  <div class="interests-grid" *ngIf="interestsList.length > 0">
    <article
      class="interest-card"
      *ngFor="let interest of interestsList">

      <h3>{{ interest.name }}</h3>

      <p *ngIf="interest.description">
        {{ interest.description }}
      </p>
    </article>
  </div>

  <p class="empty-message" *ngIf="interestsList.length === 0">
    Próximamente agregaré mis intereses profesionales.
  </p>
</section>
