
name: Angular_DockerImage

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  angular_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test -- --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: Compilar Angular
        run: npm run build -- --output-path=docs

      - name: Verificar archivos compilados
        run: |
          test -f docs/browser/index.html
          echo "Build de Angular encontrado correctamente."

      - name: Iniciar sesión en Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USER" \
            --password-stdin

      - name: Crear contenedor Apache
        if: github.event_name == 'push'
        run: docker run -d --name http_base httpd

      - name: Copiar compilación de Angular a Apache
        if: github.event_name == 'push'
        run: docker cp docs/browser/. http_base:/usr/local/apache2/htdocs/

      - name: Crear imagen personalizada
        if: github.event_name == 'push'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          docker commit \
            --change "ENV MODEL_NAME http_base" \
            http_base \
            "$DOCKER_USER/mycv:${GITHUB_SHA}"

          docker tag \
            "$DOCKER_USER/mycv:${GITHUB_SHA}" \
            "$DOCKER_USER/mycv:latest"

      - name: Subir imagen a Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          docker push "$DOCKER_USER/mycv:${GITHUB_SHA}"
          docker push "$DOCKER_USER/mycv:latest"

      - name: Desplegar en Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
